[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trend-finder-longs"
version = "1.0.0"
description = "MCP server for Binance LONG-ONLY setups - Square+orderbook aligned LONG with divergent price (pullback) as setup-change trigger"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jhonv" }
]
keywords = ["binance", "mcp", "crypto", "trading", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment"
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0"
]

[project.scripts]
binance-mcp = "server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["."]
